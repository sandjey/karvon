# Р”РѕР±Р°РІРёС‚СЊ РІ РєРѕРЅС„РёРі nginx РЅР° СЃРµСЂРІРµСЂРµ (РЅР°РїСЂРёРјРµСЂ /etc/nginx/sites-available/api.centraltrademarket.com)
# РћС‚РєСЂС‹РІР°РµС‚ admin-РїР°РЅРµР»СЊ РїРѕ Р°РґСЂРµСЃСѓ: https://api.centraltrademarket.com/admin/
# РћС‚РєСЂС‹РІР°РµС‚ СЃС…РµРјСѓ РїРѕ Р°РґСЂРµСЃСѓ:        https://api.centraltrademarket.com/docs/karvon-schema.html

# Р’РЅСѓС‚СЂРё Р±Р»РѕРєР° server { ... } РґР»СЏ api.centraltrademarket.com РґРѕР±Р°РІРёС‚СЊ:

    # РЎС‚Р°С‚РёС‡РµСЃРєРёРµ РґРѕРєСѓРјРµРЅС‚С‹ (СЃС…РµРјР°, Postman Рё С‚.Рґ.)
    location /docs/ {
        alias /home/dev_backend/karvon/docs/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    location /admin/ {
        proxy_pass         http://127.0.0.1:8085/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SPA: РїРѕРґР·Р°РїСЂРѕСЃС‹ С‚РѕР¶Рµ РёРґСѓС‚ РІ РєРѕРЅС‚РµР№РЅРµСЂ
        proxy_intercept_errors on;
        error_page 404 = /admin/index.html;
    }

