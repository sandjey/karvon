# Добавить в конфиг nginx на сервере (например /etc/nginx/sites-available/fan.sarbon.me)
# Открывает admin-панель по адресу: https://fan.sarbon.me/admin/

# Внутри блока server { ... } для fan.sarbon.me добавить:

    location /admin/ {
        proxy_pass         http://127.0.0.1:8085/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SPA: подзапросы тоже идут в контейнер
        proxy_intercept_errors on;
        error_page 404 = /admin/index.html;
    }

