<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>CTM Logistics Map</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>
<link  href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}

/* ─── PANEL ─────────────────────────────────────── */
#panel{
  position:fixed;left:0;top:0;bottom:0;width:300px;
  background:#fff;z-index:500;
  box-shadow:2px 0 16px rgba(0,0,0,.1);
  display:flex;flex-direction:column;
}

/* Header */
.hdr{background:#0C1A2E;padding:14px 16px;display:flex;align-items:center;gap:10px;}
.hdr-logo{
  width:32px;height:32px;border-radius:8px;background:#1A6FE8;
  display:grid;place-items:center;flex-shrink:0;
}
.hdr-logo svg{width:16px;height:16px;fill:#fff;}
.hdr h1{color:#fff;font-size:14px;font-weight:700;}
.hdr p{color:rgba(255,255,255,.4);font-size:11px;}

/* Search */
.search-wrap{padding:10px 12px;border-bottom:1px solid #E2EBF6;}
.search-box{
  display:flex;align-items:center;gap:8px;
  border:1.5px solid #D0E2F5;border-radius:9px;
  padding:8px 11px;background:#F3F8FF;
}
.search-box:focus-within{border-color:#1A6FE8;box-shadow:0 0 0 3px rgba(26,111,232,.1);}
.search-box svg{flex-shrink:0;opacity:.4;}
.search-box input{flex:1;border:none;background:transparent;font-size:13px;outline:none;color:#0C1A2E;}
.search-box input::placeholder{color:#9BB2C8;}
#search-results{
  display:none;margin-top:6px;
  border:1.5px solid #D0E2F5;border-radius:9px;overflow:hidden;background:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}
.sr-item{
  padding:9px 12px;cursor:pointer;
  border-bottom:1px solid #F3F8FF;
  font-size:12px;color:#0C1A2E;
  display:flex;align-items:center;gap:8px;
}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:#F3F8FF;}
.sr-item small{display:block;color:#5B7390;font-size:11px;margin-top:1px;}

/* Body scroll */
.body{flex:1;overflow-y:auto;padding:10px 12px;}

/* Hint */
.hint{
  background:#E8F1FD;border:1px solid #D0E2F5;border-radius:8px;
  padding:9px 12px;margin-bottom:10px;
  font-size:12px;color:#1A6FE8;font-weight:500;
  display:flex;align-items:center;gap:7px;
}
.hint svg{flex-shrink:0;fill:#1A6FE8;opacity:.7;}

/* Waypoints */
.wp-item{margin-bottom:4px;}
.wp-row{
  display:flex;align-items:center;gap:8px;
  padding:9px 10px;border-radius:9px;
  border:1.5px solid #D0E2F5;background:#F3F8FF;
  cursor:pointer;transition:all .15s;
}
.wp-row:hover{border-color:#3D8EF5;background:#E8F1FD;}
.wp-row.active{border-color:#1A6FE8;background:#E8F1FD;
  box-shadow:0 0 0 3px rgba(26,111,232,.12);}
.wp-row.set{border-color:#BBF7D0;background:#F0FDF4;}
.wp-dot{
  width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;flex-shrink:0;
  color:#fff;font-size:10px;font-weight:800;
}
.wp-lbl{flex:1;font-size:12px;color:#5B7390;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wp-row.set .wp-lbl{color:#0C1A2E;font-weight:500;}
.wp-acts{display:flex;gap:3px;flex-shrink:0;}
.wp-btn{
  width:22px;height:22px;border-radius:5px;border:none;
  background:transparent;cursor:pointer;font-size:13px;
  color:#9BB2C8;font-weight:700;display:grid;place-items:center;
  transition:all .1s;
}
.wp-btn:hover{background:#FEE2E2;color:#DC2626;}

/* Connector line between waypoints */
.wp-conn{width:2px;height:10px;background:#D0E2F5;margin:0 0 0 20px;}

/* Add stop button */
.btn-add-stop{
  width:100%;margin-top:6px;padding:8px 10px;
  border:1.5px dashed #D0E2F5;border-radius:9px;background:transparent;
  cursor:pointer;display:flex;align-items:center;gap:8px;
  font-size:12px;font-weight:600;color:#5B7390;
  transition:all .15s;
}
.btn-add-stop:hover{border-color:#1A6FE8;color:#1A6FE8;background:#F3F8FF;}

/* Section label */
.sec-lbl{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:#5B7390;margin:12px 0 6px;
}

/* Vehicle */
.v-row{display:flex;gap:8px;}
.v-btn{
  flex:1;padding:10px 6px;
  border:1.5px solid #D0E2F5;border-radius:10px;background:#F3F8FF;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:all .15s;
}
.v-btn:hover{border-color:#3D8EF5;background:#E8F1FD;}
.v-btn.on{border-color:#1A6FE8;background:#E8F1FD;}
.v-btn.on .v-lbl-name{color:#1A6FE8;}
.v-emoji{font-size:26px;line-height:1;}
.v-lbl-name{font-size:11px;font-weight:700;color:#5B7390;}
.v-tag{font-size:9px;font-weight:700;background:#1A6FE8;color:#fff;
  padding:1px 5px;border-radius:4px;}

/* Go / Clear buttons */
.btn-go{
  width:100%;margin-top:12px;padding:12px;
  background:#1A6FE8;color:#fff;border:none;border-radius:10px;
  font-size:13px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s;
}
.btn-go:hover:not(:disabled){background:#0C1A2E;}
.btn-go:disabled{opacity:.3;cursor:not-allowed;}
.btn-clear{
  width:100%;margin-top:6px;padding:9px;
  border:1.5px solid #D0E2F5;border-radius:10px;background:transparent;
  font-size:12px;color:#5B7390;cursor:pointer;display:none;
  transition:all .15s;
}
.btn-clear:hover{border-color:#DC2626;color:#DC2626;}

/* HGV note */
.hgv-note{
  display:none;margin-top:8px;padding:8px 11px;
  background:#FFF7ED;border-left:3px solid #F97316;border-radius:7px;
  font-size:11px;color:#9A3412;line-height:1.5;
}

/* Result */
.result-card{
  display:none;margin-top:10px;
  border:1.5px solid #D0E2F5;border-radius:10px;overflow:hidden;
}
.rc-head{background:#0C1A2E;padding:10px 12px;color:#fff;
  font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;}
.rc-body{padding:10px 12px;}
.rc-row{display:flex;justify-content:space-between;
  padding:4px 0;border-bottom:1px solid #F3F8FF;}
.rc-row:last-child{border-bottom:none;}
.rc-k{font-size:11px;color:#5B7390;}
.rc-v{font-size:13px;font-weight:700;color:#0C1A2E;}
.rc-v.blue{color:#1A6FE8;}

/* ─── MAP ────────────────────────────────────────── */
#map{position:fixed;left:300px;top:0;right:0;bottom:0;z-index:100;cursor:crosshair;}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important;}
.maplibregl-ctrl-group{border-radius:10px!important;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.12)!important;border:none!important;}
.maplibregl-popup-content{
  border-radius:12px!important;padding:0!important;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-width:180px;box-shadow:0 8px 30px rgba(0,0,0,.14)!important;
}
.maplibregl-popup-close-button{display:none!important;}
.pu-head{padding:10px 12px 8px;}
.pu-kind{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px;}
.pu-kind.cargo{color:#EA580C;}.pu-kind.wh{color:#1A6FE8;}
.pu-name{font-size:13px;font-weight:600;}
.pu-sub{font-size:11px;color:#5B7390;margin-top:2px;}
.pu-foot{padding:7px 12px;border-top:1px solid #F3F8FF;text-align:right;}
.pu-close{font-size:12px;color:#1A6FE8;cursor:pointer;font-weight:600;}
</style>
</head>
<body>

<!-- ═══════════ PANEL ═══════════ -->
<div id="panel">

  <div class="hdr">
    <div class="hdr-logo">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/></svg>
    </div>
    <div><h1>CTM Logistics</h1><p>Marshrut tuzuvchi</p></div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0C1A2E" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="s-inp" type="text" placeholder="Shahar, ko'cha, joy..." autocomplete="off">
    </div>
    <div id="search-results"></div>
  </div>

  <div class="body">

    <!-- Hint -->
    <div class="hint" id="hint">
      <svg width="12" height="12" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01" stroke="#1A6FE8" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span id="hint-txt">Xaritada A nuqtani bosing</span>
    </div>

    <!-- Waypoints list — rendered by JS -->
    <div id="wp-list"></div>
    <button class="btn-add-stop" id="btn-add-stop">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Oraliq nuqta qo'shish
    </button>

    <!-- Vehicle -->
    <div class="sec-lbl">Transport turi</div>
    <div class="v-row">
      <button class="v-btn on" id="v-car" onclick="setVehicle('driving-car',this)">
        <span class="v-emoji">🚗</span>
        <span class="v-lbl-name">Yengil</span>
      </button>
      <button class="v-btn" id="v-hgv" onclick="setVehicle('driving-hgv',this)">
        <span class="v-emoji">🚛</span>
        <span class="v-lbl-name">Yuk</span>
        <span class="v-tag">HGV</span>
      </button>
    </div>

    <div class="hgv-note" id="hgv-note">
      🚛 Ko'prik balandligi, yo'l vazni va kenglik cheklovlari hisobga olinadi.
    </div>

    <!-- Route button -->
    <button class="btn-go" id="btn-go" disabled onclick="drawRoute()">
      → Yo'lni ko'rsat
    </button>
    <button class="btn-clear" id="btn-clear" onclick="clearAll()">
      Hammasini tozalash
    </button>

    <!-- Result card -->
    <div class="result-card" id="result-card">
      <div class="rc-head">📍 <span id="rc-title">Marshrut</span></div>
      <div class="rc-body">
        <div class="rc-row"><span class="rc-k">Masofa</span><span class="rc-v blue" id="rc-dist">—</span></div>
        <div class="rc-row"><span class="rc-k">Taxminiy vaqt</span><span class="rc-v" id="rc-time">—</span></div>
        <div class="rc-row"><span class="rc-k">Nuqtalar soni</span><span class="rc-v" id="rc-pts">—</span></div>
      </div>
    </div>

  </div>
</div>

<!-- ═══════════ MAP ═══════════ -->
<div id="map"></div>

<script>
// ─── Config ─────────────────────────────────────────
const MT_KEY = 'IMtNu6UNxo2LBpjLSZpj';
const ORS_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjgyYTEyYzczMWNmZjRkNGJiZTM2ZWE5MGU5ZWEzZWEyIiwiaCI6Im11cm11cjY0In0=';
const API_BASE = window.location.origin;

// ─── State ──────────────────────────────────────────
// wps: [{lat, lng, label, marker}|null, ...]  — index 0 = A, last = B, middle = stops
let wps = [null, null];          // A=0, B=1
let wpIdCtr = 0;
let vehicle = 'driving-car';
let activeIdx = 0;               // which waypoint gets the next map click

// ─── Map ────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  style: `https://api.maptiler.com/maps/streets-v2/style.json?key=${MT_KEY}&language=uz`,
  center: [69.2401, 41.2995],
  zoom: 11,
  attributionControl: false,
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.ScaleControl({unit:'metric'}), 'bottom-left');
map.addControl(new maplibregl.GeolocateControl({
  positionOptions:{enableHighAccuracy:true}, trackUserLocation:true
}), 'top-right');

// ─── Register click IMMEDIATELY (before map load) ───
map.on('click', handleMapClick);

async function handleMapClick(e) {
  // If clicked on a cargo/warehouse marker, show popup instead
  let onMarker = false;
  try {
    const f = map.queryRenderedFeatures(e.point, {layers:['lc','lw']});
    if (f && f.length > 0) { onMarker = true; showPopup(f[0], e.lngLat); }
  } catch(_) {}
  if (onMarker) return;

  const {lng, lat} = e.lngLat;
  placeWaypoint(activeIdx, lng, lat);
}

function placeWaypoint(idx, lng, lat) {
  // Remove old marker if exists
  if (wps[idx] && wps[idx].marker) wps[idx].marker.remove();

  // Create MapLibre built-in marker (color prop = colored pin, no custom element needed)
  const colors = ['#16A34A','#DC2626','#1A6FE8','#9333EA','#EA580C'];
  const color = idx === 0 ? '#16A34A' : idx === wps.length-1 ? '#DC2626' : '#1A6FE8';
  const marker = new maplibregl.Marker({color, scale:0.9})
    .setLngLat([lng, lat])
    .addTo(map);

  wps[idx] = {lng, lat, label:`${lat.toFixed(5)}, ${lng.toFixed(5)}`, marker};
  renderPanel();
  updateGoBtn();

  // Advance to next empty slot
  const next = wps.findIndex((w, i) => i > idx && w === null);
  if (next !== -1) activeIdx = next;
  else {
    const any = wps.findIndex(w => w === null);
    if (any !== -1) activeIdx = any;
    // All set — keep activeIdx at last to allow override
  }

  // Reverse geocode in background
  revGeo(lng, lat).then(label => {
    if (wps[idx]) { wps[idx].label = label; renderPanel(); }
  }).catch(()=>{});
}

// ─── Panel render ────────────────────────────────────
function renderPanel() {
  const list = document.getElementById('wp-list');
  list.innerHTML = '';
  const n = wps.length;

  wps.forEach((wp, i) => {
    const isFirst = i === 0;
    const isLast  = i === n - 1;
    const isMid   = !isFirst && !isLast;
    const letter  = isFirst ? 'A' : isLast ? 'B' : String(i);
    const placeholder = isFirst ? "Boshlang'ich nuqtani bosing..."
                      : isLast  ? "Oxirgi nuqtani bosing..."
                                : "Oraliq nuqtani bosing...";
    const label = wp ? wp.label : placeholder;
    const isActive = i === activeIdx;
    const isSet    = !!wp;

    const rowCls = ['wp-row', isSet?'set':'', isActive&&!isSet?'active':''].filter(Boolean).join(' ');
    const dotColor = isFirst ? '#16A34A' : isLast ? '#DC2626' : '#1A6FE8';

    const item = document.createElement('div');
    item.className = 'wp-item';
    item.innerHTML = `
      <div class="${rowCls}" data-idx="${i}">
        <span class="wp-dot" style="background:${dotColor}">${letter}</span>
        <span class="wp-lbl">${label}</span>
        <span class="wp-acts">
          ${isSet ? `<button class="wp-btn" onclick="clearWp(${i})" title="Tozalash">✕</button>` : ''}
          ${isMid ? `<button class="wp-btn" onclick="removeWp(${i})" title="O'chirish">−</button>` : ''}
        </span>
      </div>
      ${!isLast ? '<div class="wp-conn"></div>' : ''}
    `;
    item.querySelector('.wp-row').addEventListener('click', ev => {
      if (ev.target.closest('.wp-btn')) return;
      activeIdx = i;
      renderPanel();
    });
    list.appendChild(item);
  });

  // Update hint
  const hintEl = document.getElementById('hint');
  const hintTxt = document.getElementById('hint-txt');
  const emptyIdx = wps.findIndex(w => w === null);
  if (emptyIdx === -1) {
    hintEl.style.display = 'none';
  } else {
    hintEl.style.display = 'flex';
    const letter = emptyIdx === 0 ? 'A' : emptyIdx === wps.length-1 ? 'B' : String(emptyIdx);
    hintTxt.textContent = `Xaritada ${letter} nuqtani bosing`;
  }
}

function clearWp(idx) {
  if (wps[idx] && wps[idx].marker) wps[idx].marker.remove();
  wps[idx] = null;
  activeIdx = idx;
  clearRouteLayer();
  renderPanel();
  updateGoBtn();
}

function removeWp(idx) {
  if (wps[idx] && wps[idx].marker) wps[idx].marker.remove();
  wps.splice(idx, 1);
  if (activeIdx >= wps.length) activeIdx = wps.length - 1;
  clearRouteLayer();
  renderPanel();
  updateGoBtn();
}

function clearAll() {
  wps.forEach(w => { if(w&&w.marker) w.marker.remove(); });
  wps = [null, null];
  activeIdx = 0;
  clearRouteLayer();
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('btn-clear').style.display = 'none';
  renderPanel();
  updateGoBtn();
}

function updateGoBtn() {
  const ready = wps.filter(w => w !== null).length >= 2;
  document.getElementById('btn-go').disabled = !ready;
}

// ─── Vehicle ─────────────────────────────────────────
function setVehicle(v, btn) {
  vehicle = v;
  document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('hgv-note').style.display = v === 'driving-hgv' ? 'block' : 'none';
  if (wps.filter(w=>w).length >= 2) drawRoute();
}

// ─── Route ───────────────────────────────────────────
async function drawRoute() {
  const pts = wps.filter(w => w !== null);
  if (pts.length < 2) return;

  const btn = document.getElementById('btn-go');
  btn.textContent = '⏳ Yuklanmoqda...';
  btn.disabled = true;

  try {
    const coords = pts.map(p => [p.lng, p.lat]);
    const res = await fetch(
      `https://api.openrouteservice.org/v2/directions/${vehicle}/geojson`,
      {
        method: 'POST',
        headers: {
          'Authorization': ORS_KEY,
          'Content-Type': 'application/json',
          'Accept': 'application/geo+json, application/json',
        },
        body: JSON.stringify({coordinates: coords}),
      }
    );
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(`ORS ${res.status}: ${txt}`);
    }
    const data = await res.json();
    const feat = data.features[0];
    const {distance, duration} = feat.properties.summary;

    // Draw route
    if (!map.getSource('route')) {
      map.addSource('route', {type:'geojson', data: {type:'FeatureCollection',features:[]}});
      map.addLayer({id:'route-shadow', type:'line', source:'route',
        layout:{'line-join':'round','line-cap':'round'},
        paint:{'line-color':'#fff','line-width':10,'line-opacity':.8}});
      map.addLayer({id:'route-line', type:'line', source:'route',
        layout:{'line-join':'round','line-cap':'round'},
        paint:{'line-color': vehicle==='driving-hgv'?'#EA580C':'#1A6FE8',
               'line-width':5,
               ...(vehicle==='driving-hgv'?{'line-dasharray':[2,1.5]}:{})}});
    } else {
      map.getSource('route').setData({
        type:'FeatureCollection',
        features:[{type:'Feature', geometry:feat.geometry, properties:{}}]
      });
      map.setPaintProperty('route-line','line-color',vehicle==='driving-hgv'?'#EA580C':'#1A6FE8');
    }
    map.getSource('route').setData({
      type:'FeatureCollection',
      features:[{type:'Feature', geometry:feat.geometry, properties:{}}]
    });

    // Fit bounds
    const cs = feat.geometry.coordinates;
    const lons = cs.map(c=>c[0]), lats = cs.map(c=>c[1]);
    map.fitBounds(
      [[Math.min(...lons),Math.min(...lats)],[Math.max(...lons),Math.max(...lats)]],
      {padding:{top:50,bottom:50,left:60,right:80},duration:700}
    );

    // Show result
    const km = distance >= 1000 ? `${(distance/1000).toFixed(1)} km` : `${Math.round(distance)} m`;
    const h = Math.floor(duration/3600), m = Math.round((duration%3600)/60);
    const timeStr = h ? `${h} soat ${m} daqiqa` : `${m} daqiqa`;

    document.getElementById('rc-title').textContent = vehicle==='driving-hgv'?'🚛 Yuk (HGV)':'🚗 Yengil mashina';
    document.getElementById('rc-dist').textContent = km;
    document.getElementById('rc-time').textContent = timeStr;
    document.getElementById('rc-pts').textContent = `${pts.length} ta nuqta`;
    document.getElementById('result-card').style.display = 'block';
    document.getElementById('btn-clear').style.display = 'block';

  } catch(err) {
    alert(`Marshrut chizib bo'lmadi.\n${err.message}`);
    console.error(err);
  }

  btn.textContent = '→ Yo\'lni ko\'rsat';
  btn.disabled = wps.filter(w=>w).length < 2;
}

function clearRouteLayer() {
  try {
    if (map.getSource('route')) {
      map.getSource('route').setData({type:'FeatureCollection',features:[]});
    }
  } catch(_){}
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('btn-clear').style.display = 'none';
}

// ─── Add intermediate stop ────────────────────────────
document.getElementById('btn-add-stop').addEventListener('click', () => {
  // Insert before last (B) point
  const lastIdx = wps.length - 1;
  wps.splice(lastIdx, 0, null);
  activeIdx = lastIdx; // new middle stop is now at lastIdx
  renderPanel();
  updateGoBtn();
});

// ─── Map load: add cargo/warehouse markers ────────────
map.on('load', () => {
  // Custom circle images for markers
  function circleImg(hex) {
    const N=22, cv=document.createElement('canvas');
    cv.width=N; cv.height=N;
    const x=cv.getContext('2d'), r=N/2-2, c=N/2;
    x.shadowColor='rgba(0,0,0,.2)'; x.shadowBlur=4; x.shadowOffsetY=2;
    x.beginPath(); x.arc(c,c,r,0,Math.PI*2); x.fillStyle=hex; x.fill();
    x.shadowBlur=0; x.shadowOffsetY=0;
    x.beginPath(); x.arc(c,c,r,0,Math.PI*2);
    x.strokeStyle='#fff'; x.lineWidth=2.5; x.stroke();
    return {data:x.getImageData(0,0,N,N), width:N, height:N};
  }
  map.addImage('ic-cargo', circleImg('#EA580C'));
  map.addImage('ic-wh', circleImg('#1A6FE8'));

  map.addSource('pts', {
    type:'geojson',
    data:`${API_BASE}/api/v1/map/markers`,
  });
  map.addLayer({id:'lc', type:'symbol', source:'pts',
    filter:['==',['get','kind'],'cargo'],
    layout:{'icon-image':'ic-cargo','icon-size':1,'icon-allow-overlap':true}});
  map.addLayer({id:'lw', type:'symbol', source:'pts',
    filter:['==',['get','kind'],'warehouse'],
    layout:{'icon-image':'ic-wh','icon-size':1,'icon-allow-overlap':true}});

  map.on('mouseenter','lc',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','lc',()=>map.getCanvas().style.cursor='crosshair');
  map.on('mouseenter','lw',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','lw',()=>map.getCanvas().style.cursor='crosshair');
});

// ─── Marker popup ─────────────────────────────────────
const popup = new maplibregl.Popup({offset:12, closeButton:false, maxWidth:'220px'});
function showPopup(feature, lngLat) {
  const p = feature.properties;
  const isCargo = p.kind === 'cargo';
  popup.setLngLat(lngLat).setHTML(`
    <div class="pu-head">
      <div class="pu-kind ${isCargo?'cargo':'wh'}">${isCargo?"YUK E'LONI":"OMBOR"}</div>
      <div class="pu-name">${p.title||'—'}</div>
      ${(isCargo?p.city:p.address)?`<div class="pu-sub">${isCargo?p.city:p.address}</div>`:''}
    </div>
    <div class="pu-foot">
      <span class="pu-close" onclick="this.closest('.maplibregl-popup').remove()">Yopish</span>
    </div>
  `).addTo(map);
}

// ─── Search ───────────────────────────────────────────
let searchTimer;
const sInp = document.getElementById('s-inp');
const sRes = document.getElementById('search-results');

sInp.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = sInp.value.trim();
  if (q.length < 2) { sRes.style.display='none'; return; }
  searchTimer = setTimeout(() => doSearch(q), 300);
});
sInp.addEventListener('keydown', e => {
  if (e.key === 'Escape') { sRes.style.display='none'; sInp.value=''; }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) sRes.style.display = 'none';
});

async function doSearch(q) {
  try {
    const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(q)}.json?key=${MT_KEY}&language=uz&limit=5&bbox=55,35,75,48&proximity=69.24,41.30`;
    const {features=[]} = await fetch(url).then(r=>r.json());
    if (!features.length) { sRes.style.display='none'; return; }
    sRes.innerHTML = features.map(f => {
      const name = f.text || '';
      const sub  = (f.context||[]).map(c=>c.text).filter(Boolean).join(', ');
      return `<div class="sr-item" data-lng="${f.center[0]}" data-lat="${f.center[1]}">
        <svg width="10" height="13" viewBox="0 0 12 16" fill="#1A6FE8"><path d="M6 0C3.24 0 1 2.24 1 5c0 3.75 5 11 5 11S11 8.75 11 5c0-2.76-2.24-5-5-5zm0 7.5C4.62 7.5 3.5 6.38 3.5 5S4.62 2.5 6 2.5 8.5 3.62 8.5 5 7.38 7.5 6 7.5z"/></svg>
        <div><span>${name}</span>${sub?`<small>${sub}</small>`:''}</div>
      </div>`;
    }).join('');
    sRes.style.display = 'block';
    sRes.querySelectorAll('.sr-item').forEach(el => {
      el.addEventListener('click', () => {
        map.flyTo({center:[+el.dataset.lng,+el.dataset.lat], zoom:14, speed:1.3});
        sRes.style.display = 'none';
        sInp.value = el.querySelector('span').textContent;
      });
    });
  } catch(_) { sRes.style.display='none'; }
}

// ─── Reverse geocoding ────────────────────────────────
async function revGeo(lng, lat) {
  const url = `https://api.maptiler.com/geocoding/${lng},${lat}.json?key=${MT_KEY}&language=uz`;
  const {features=[]} = await fetch(url).then(r=>r.json());
  if (features[0]) return features[0].place_name || features[0].text || '';
  return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
}
