version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: karvon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-karvon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-karvon_pass}
      POSTGRES_DB: ${DB_NAME:-karvon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-karvon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: karvon_app
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
