version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: karvon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-karvon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-karvon_pass}
      POSTGRES_DB: ${DB_NAME:-karvon}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-karvon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  whatsapp:
    image: node:20-alpine
    container_name: karvon_whatsapp
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./services/whatsapp:/app
      - whatsapp_auth:/app/auth_info
      - whatsapp_modules:/app/node_modules
    command: sh -c "apk add --no-cache git python3 make g++ && npm install && node index.js"
    ports:
      - "3210:3210"
    environment:
      WHATSAPP_SERVICE_PORT: 3210
      WHATSAPP_SERVICE_TOKEN: ${WHATSAPP_OTP_TOKEN:-}
      WHATSAPP_AUTH_DIR: ./auth_info

  app:
    image: golang:1.26-alpine
    container_name: karvon_app
    working_dir: /app
    volumes:
      - .:/app
      - go_cache:/go/pkg/mod
    command: go run ./cmd/api
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgres://karvon:karvon_pass@postgres:5432/karvon?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_key_change_in_production}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      TELEGRAM_GATEWAY_BASE_URL: ${TELEGRAM_GATEWAY_BASE_URL:-https://gatewayapi.telegram.org}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
      TELEGRAM_GATEWAY_BYPASS: ${TELEGRAM_GATEWAY_BYPASS:-false}
      WHATSAPP_OTP_BASE_URL: http://whatsapp:3210
      WHATSAPP_OTP_TOKEN: ${WHATSAPP_OTP_TOKEN:-}
      WHATSAPP_OTP_BYPASS: ${WHATSAPP_OTP_BYPASS:-false}
      APP_PORT: ${APP_PORT:-8080}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: ${STORAGE_PATH:-./uploads}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  go_cache:
  whatsapp_auth:
  whatsapp_modules:
