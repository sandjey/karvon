version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: karvon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-karvon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-karvon_pass}
      POSTGRES_DB: ${DB_NAME:-karvon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-karvon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  whatsapp:
    image: node:20-alpine
    container_name: karvon_whatsapp
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./services/whatsapp:/app
      - whatsapp_auth:/app/auth_info
      - whatsapp_modules:/app/node_modules
    command: sh -c "apk add --no-cache git python3 make g++ && npm install && node index.js"
    ports:
      - "3211:3211"
    environment:
      WHATSAPP_SERVICE_PORT: 3211
      WHATSAPP_SERVICE_TOKEN: ${WHATSAPP_OTP_TOKEN:-}
      WHATSAPP_AUTH_DIR: ./auth_info

  app:
    build: .
    container_name: karvon_app
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  whatsapp_auth:
  whatsapp_modules:
