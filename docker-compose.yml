version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: karvon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-karvon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-karvon_pass}
      POSTGRES_DB: ${DB_NAME:-karvon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-karvon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  whatsapp:
    image: node:20-alpine
    container_name: karvon_whatsapp
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./services/whatsapp:/app
      - whatsapp_auth:/app/auth_info
      - whatsapp_modules:/app/node_modules
    command: sh -c "apk add --no-cache git python3 make g++ && npm install && node index.js"
    ports:
      - "3211:3211"
    environment:
      WHATSAPP_SERVICE_PORT: 3211
      WHATSAPP_SERVICE_TOKEN: ${WHATSAPP_OTP_TOKEN:-}
      WHATSAPP_AUTH_DIR: ./auth_info

  app:
    build: .
    container_name: karvon_app
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.centraltrademarket.com/api/v1}
    container_name: karvon_admin
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - app

  # РЎРІРѕСЏ РєР°СЂС‚Р° вЂ” self-hosted СЃРµСЂРІРµСЂ С‚Р°Р№Р»РѕРІ OpenStreetMap (Leaflet РЅР° С„СЂРѕРЅС‚Рµ СѓРєР°Р·С‹РІР°РµС‚ СЃСЋРґР°).
  # РџРѕР»РѕР¶РёС‚Рµ СЂРµРіРёРѕРЅ-СЌРєСЃС‚СЂР°РєС‚ РІ ./services/tiles/tiles.mbtiles (РЅР°РїСЂРёРјРµСЂ РЈР·Р±РµРєРёСЃС‚Р°РЅ+РЎРќР“ РёР· openmaptiles/geofabrik),
  # Р·Р°С‚РµРј Р·Р°РїСѓСЃС‚РёС‚Рµ: docker compose up -d tiles
  # РљР°СЂС‚Р° Р±СѓРґРµС‚ РґРѕСЃС‚СѓРїРЅР° РЅР° http://<host>:8083  (С„СЂРѕРЅС‚: MAP_TILES_URL=https://maps.fan.sarbon.me)
  tiles:
    image: maptiler/tileserver-gl:latest
    container_name: karvon_tiles
    restart: unless-stopped
    command: ["--mbtiles", "tiles.mbtiles", "--port", "8083"]
    volumes:
      - ./services/tiles:/data
    ports:
      - "8083:8083"

volumes:
  postgres_data:
  whatsapp_auth:
  whatsapp_modules:
